name: pstack

# Rebuilds plugins/pstack from cursor/plugins and commits it straight to main when it changed.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build/pstack/generate.mjs
      - build/pstack/omp/**

permissions:
  contents: write

# Shared with zstack.yml: both workflows rewrite .omp-plugin/marketplace.json.
concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      # The tip of main, not the triggering commit: a run queued behind the other catalog workflow must build on its push.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/checkout@v7
        with:
          repository: cursor/plugins
          path: .upstream
          sparse-checkout: |
            pstack
            scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node build/pstack/generate.mjs .upstream
      - name: Commit to main
        run: |
          git add plugins/pstack .omp-plugin/marketplace.json
          if git diff --cached --quiet; then
            echo "plugins/pstack already matches upstream."
            exit 0
          fi
          upstream=$(git -C .upstream rev-parse --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "* Regenerate pstack from cursor/plugins@${upstream}"
          git push
