name: pstack

# Rebuilds pstack/plugin from cursor/plugins and commits it straight to main when it changed.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pstack/generate.mjs
      - pstack/omp/**

permissions:
  contents: write

concurrency:
  group: pstack
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: cursor/plugins
          path: .upstream
          sparse-checkout: |
            pstack
            scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node pstack/generate.mjs .upstream
      - name: Commit to main
        run: |
          git add pstack/plugin .omp-plugin/marketplace.json
          if git diff --cached --quiet; then
            echo "pstack/plugin already matches upstream."
            exit 0
          fi
          upstream=$(git -C .upstream rev-parse --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "* Regenerate pstack from cursor/plugins@${upstream}"
          git push
