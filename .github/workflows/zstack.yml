name: zstack

# Gives zstack a new version whenever its content changes on main, so `omp plugin upgrade` picks it up.
on:
  push:
    branches: [main]
    paths:
      - plugins/zstack/**

permissions:
  contents: write

# Shared with pstack.yml: both workflows rewrite .omp-plugin/marketplace.json.
concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      # The tip of main, not the triggering commit: a run queued behind the other catalog workflow must build on its push.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Commit to main
        run: |
          version=$(node build/zstack/version.mjs)
          git add plugins/zstack/.claude-plugin/plugin.json .omp-plugin/marketplace.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "* Version zstack ${version}"
          git push
